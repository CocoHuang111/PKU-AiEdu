name: pku2

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: pku2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: pku2
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pku2 -d pku2"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env.production 中设置 DATABASE_URL}
      APP_ENV: production
      PKU_MODE: cloud
      UPLOAD_ROOT: /app/data/uploads
      HF_HOME: /app/models/hf
    volumes:
      - app_data:/app/data
      - hf_cache:/app/models/hf
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "backend.app.workers.runner"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env.production 中设置 DATABASE_URL}
      APP_ENV: production
      PKU_MODE: cloud
      UPLOAD_ROOT: /app/data/uploads
      HF_HOME: /app/models/hf
      EVALUATION_WORKER_POLL_SECONDS: "2"
      EVALUATION_HEARTBEAT_SECONDS: "15"
      EVALUATION_LEASE_SECONDS: "120"
      EVALUATION_UPLOAD_MAX_AGE_SECONDS: "7200"
    volumes:
      - app_data:/app/data
      - hf_cache:/app/models/hf
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  archive-worker:
    image: pku2-worker:latest
    restart: unless-stopped
    command: ["python", "-m", "backend.app.workers.archive"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env.production 中设置 DATABASE_URL}
      APP_ENV: production
      PKU_MODE: cloud
      UPLOAD_ROOT: /app/data/uploads
    volumes:
      - app_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?请在 .env.production 中设置 SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  pgdata:
    name: pku2_pgdata
  app_data:
    name: pku2_app_data
  hf_cache:
    name: pku2_hf_cache
  caddy_data:
    name: pku2_caddy_data
  caddy_config:
    name: pku2_caddy_config
