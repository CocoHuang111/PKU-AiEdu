# 学生发言的线索词：ASR 无法区分说话人，只能靠语言标志粗略估计。
# 注意「我觉得」「我认为」教师讲课时说得更多，本项是系统性高估的粗估值，
# 只在未启用说话人分离时作为兜底证据使用。
student_speech_markers:
  - 老师我
  - 老师，我
  - 我觉得
  - 我认为
  - 我想问
  - 请问老师
  - 报告老师

# 声学特征评分阈值
audio_thresholds:
  # 长停顿：超过这个秒数的静音算作非正常停顿
  long_pause_sec: 2.5
  # 语速理想区间（字/分钟）
  speech_rate_ideal: [200, 280]
  # 信噪比：低于此值认为课堂噪音偏大
  snr_good_db: 15.0

# 时序特征阈值：作用于带时间戳的 ASR 片段
timeline_thresholds:
  # ASR 段平均对数概率低于此值记为低置信段
  asr_low_confidence_logprob: -0.6

# 课件时序阈值：作用于本地帧差检测出的切换事件
slide_thresholds:
  # 关键页面停留少于这个秒数视为「没给学生记录时间」
  dwell_min_sec: 20.0
  # 判断「切换与讲授同步」时，在切换时刻前后各找多少秒内的过渡话语
  sync_window_sec: 10.0
