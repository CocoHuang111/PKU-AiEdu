  - 针对无学生视频，缺乏模拟互动或设问
  not_observable_when:
  - 纯录播且无学生画面，且课程设计要求为单向讲授
  minor_when:
  - 互动频次较低，但包含了基本的提问或设问环节
  major_when:
  - 全程零互动（无提问、无讨论、无设问）
  - 教师自问自答且未留给学生任何思考时间
  severity: context_dependent
