  - 课程内容为纯事实性记忆或基础操作演示，客观上不需要深度启发
  minor_when:
  - 以讲授为主，但穿插了少量引导性问题或思考提示
  major_when:
  - 全程满堂灌，直接给出所有结论，完全剥夺学生思考过程
