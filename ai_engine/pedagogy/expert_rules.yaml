- rule_id: other_teaching_aids_rule
  target_dimension: teaching_method
  phenomenon: 教学辅助与环节设计不当
  applicable_when:
  - 导入环节设计生硬或无效
  - 多媒体工具使用不当（如该用动画展示公式却用静态）
  - PPT排版或配色严重影响视觉体验
  not_observable_when:
  - 无法获取教学设计意图，仅凭视频无法判断某种辅助手段是否最优
  minor_when:
  - 导入或小结环节较为平淡，多媒体使用基本达标但缺乏亮点，PPT排版普通
  major_when:
  - 导入完全偏离主题
  - 多媒体使用严重干扰教学（如动画闪烁、声画不同步）
