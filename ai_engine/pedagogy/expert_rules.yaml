- rule_id: expression_weak_rule
  target_dimension: teaching_quality
  phenomenon: 表达不清、不准确或冗余
  applicable_when:
  - 教师频繁使用无意义口头禅（如“然后”、“对吧”）
  - 中英文混用且缺乏条理
  - 语句重复、含糊不清
  not_observable_when:
  - 教师使用专业外语术语进行双语教学，且语境清晰
  minor_when:
  - 偶尔出现口头禅或轻微重复，但不影响核心语义的传达
  major_when:
  - 口头禅极其频繁（如每句话都有）
  - 表达逻辑混乱、含糊不清，导致学生无法理解讲授内容
