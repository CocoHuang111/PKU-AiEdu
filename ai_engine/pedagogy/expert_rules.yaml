- rule_id: ppt_blackboard_coordination_rule
  target_dimension: teaching_method
  phenomenon: 课件、板书与讲授配合不足
  applicable_when:
  - 教师讲授内容与PPT展示内容不同步
  - PPT与板书功能重叠或冲突
  - 教师未使用指示工具指引PPT内容
  not_observable_when:
  - 纯PPT录屏无教师画面
  - 纯板书授课无PPT
  minor_when:
  - 偶尔翻页不同步，或未使用指示工具，但通过口头描述能明确所指内容
  major_when:
  - 讲授与PPT严重脱节（如讲A页翻到B页）
  - PPT与板书内容冲突，导致学生认知混乱
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_method 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
