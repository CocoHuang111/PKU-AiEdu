- rule_id: ppt_overloaded_rule
  target_dimension: teaching_method
  phenomenon: 课件文字或信息过载
  applicable_when:
  - 单页PPT包含大段文字，信息密度过高
  - 缺乏图表或视觉元素辅助
  not_observable_when:
  - 课件为参考文献列表、代码块或必须完整展示的复杂表格
  minor_when:
  - 个别页面文字较多，但教师能通过口头讲解提炼重点，不致使学生迷失
  major_when:
  - 绝大多数页面均为大段文字堆砌，缺乏提炼
  - 课件变成讲稿搬家，严重影响视觉吸收
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_method 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
    major_when，在 teaching_method 维度作为主要缺陷进行显著扣分，一个严重问题或与本维其他独立问题累计时，允许导致该维度低于60分。
