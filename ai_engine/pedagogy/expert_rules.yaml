- rule_id: fluency_weak_rule
  target_dimension: teaching_attitude
  phenomenon: 讲解不够熟练或流畅
  applicable_when:
  - 教师在讲授过程中出现明显的停顿、卡壳、语句不连贯
  - 频繁自我纠正
  not_observable_when:
  - 教师为了强调重点而进行的刻意停顿或留白
  minor_when:
  - 偶尔出现短暂卡顿或思考停顿，但能迅速恢复，不影响整体流畅度
  major_when:
  - 频繁卡壳、长时间停顿
  - 严重依赖讲稿导致讲解支离破碎，严重影响知识传递的连贯性
