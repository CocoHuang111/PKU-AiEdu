- rule_id: logic_weak_rule
  target_dimension: teaching_content
  phenomenon: 内容组织、衔接或逻辑不清
  applicable_when:
  - 知识点之间缺乏过渡，因果关系或推导过程不严密
  - 内容结构混乱
  - 未交代与前后课程的逻辑联系
  not_observable_when:
  - 视频为跳跃性剪辑的集锦，缺乏连贯上下文
  minor_when:
  - 整体逻辑通顺，但个别知识点之间的过渡略显生硬或缺乏 explicit 衔接词
  major_when:
  - 内容组织混乱，前后矛盾
  - 核心推导过程存在严重逻辑断层，导致学生无法理解知识脉络
