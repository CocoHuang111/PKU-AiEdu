    high_score_share: 0.093
    low_score_share: 0.2558
    suggested_severity: context_dependent
- rule_id: engagement_weak_rule
  target_dimension: teaching_attitude
  phenomenon: 感染力、激情或生动性不足
  applicable_when:
  - 教师语调平淡无起伏，缺乏肢体语言
  - 讲解枯燥，未使用案例、比喻或生动的情境辅助
  not_observable_when:
  - 课程内容本身为高度抽象或严肃的理论推导，客观上不需要过多情感渲染
  minor_when:
  - 语调较为平缓，但表达清晰，学生能跟上思路
  major_when:
  - 全程毫无激情、语调催眠，且缺乏任何生动案例或互动设计，导致课堂气氛极度沉闷
