- rule_id: pace_weak_rule
  target_dimension: teaching_quality
  phenomenon: 语速、节奏或时间控制不当
  applicable_when:
  - 教师语速持续过快或过慢
  - 时间分配不合理（如重点内容一笔带过，次要内容长篇大论）
  not_observable_when:
  - 教师为了强调重点而刻意放慢语速，或为了赶进度在结尾加快语速
  minor_when:
  - 语速整体适中，仅在个别难点或结尾处语速稍快或稍慢，但不影响整体理解
  major_when:
  - 全程语速过快导致内容无法消化
  - 严重拖沓导致核心内容未讲完，时间控制严重失控
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_quality 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
