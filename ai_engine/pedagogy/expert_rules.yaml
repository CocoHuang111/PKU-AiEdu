- rule_id: goal_unclear_rule
  target_dimension: teaching_content
  phenomenon: 教学目标或本节定位不清
  applicable_when:
  - 课程开头或结尾未明确说明本节课的教学目标、学习重点或在整个课程中的定位
  not_observable_when:
  - 视频为无上下文的微课片段，且课件中已包含清晰的目录或标题
  minor_when:
  - 未口头明确陈述教学目标，但通过课件标题或内容导入能自然推断出本节重点
  major_when:
  - 全程未交代教学目标，且内容发散，导致无法判断本节课的核心学习目的和定位
