rules:
- rule_id: bearing_weak_rule
  target_dimension: teaching_attitude
  phenomenon: 教态、表情、目光或动作不足
  applicable_when:
  - 视频中教师面部表情紧张或不自然
  - 目光长时间未面向镜头或学生（如一直看PPT）
  - 肢体动作僵硬或仪容不整（如头发零乱）
  not_observable_when:
  - 纯画外音授课
  - 镜头仅拍摄PPT或板书而未拍摄教师
  minor_when:
  - 偶尔目光偏离或表情略显紧张，但整体教态自然，不影响教学传达
  major_when:
  - 全程背对学生或镜头读屏
  - 面部表情极度紧张或不自然
  - 仪容严重不整，严重影响教学感染力
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_attitude 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
    major_when，在 teaching_attitude 维度作为主要缺陷进行显著扣分，一个严重问题或与本维其他独立问题累计时，允许导致该维度低于60分。
  primary_dimension: teaching_attitude
  must_not_penalize_dimensions:
  - teaching_method
  - teaching_content
  support_issue_key: bearing_weak
  confidence: high
  approved: true
  support:
    n_records: 107
    n_teachers: 69
    median_score: 3.2
    high_score_share: 0.1884
    low_score_share: 0.2029
    suggested_severity: context_dependent
- rule_id: content_incomplete_rule
  target_dimension: teaching_content
  phenomenon: 内容或知识闭环不完整
  applicable_when:
  - 视频开头缺乏导入环节直接切入正题
  - 视频结尾 abrupt 结束无总结
  - 讲授的知识点缺乏前因后果或理论推导，呈现碎片化
  not_observable_when:
  - 视频明确标记为课程中间的一个片段，且无法获取完整上下文
  minor_when:
  - 缺少简短的导入或总结，但核心知识点讲解完整，逻辑自洽
  major_when:
  - 讲授内容明显是一个未完成的片段，缺乏核心知识点的完整闭环
  - 完全缺失导入和总结导致课程结构严重残缺
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_content 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
    major_when，在 teaching_content 维度作为主要缺陷进行显著扣分，一个严重问题或与本维其他独立问题累计时，允许导致该维度低于60分。
  primary_dimension: teaching_content
  must_not_penalize_dimensions:
  - teaching_method
  - teaching_quality
  support_issue_key: content_incomplete
  confidence: high
  approved: true
  support:
    n_records: 47
    n_teachers: 44
    median_score: 3.3175
    high_score_share: 0.3864
    low_score_share: 0.1818
    suggested_severity: context_dependent
- rule_id: depth_or_focus_weak_rule
  target_dimension: teaching_content
  phenomenon: 重点难点、深度或详略不当
  applicable_when:
  - 讲解平铺直叙，未对核心概念进行强调
  - 对难点或重点讲解浅尝辄止
  - 花费大量时间讲解与主题无关的次要内容
  not_observable_when:
  - 无法获取课程大纲或教学目标，且仅凭视频常识无法判断内容深浅是否合理
  minor_when:
  - 重点有提及但强调不够，或个别次要内容占用时间稍多，但核心内容讲解到位
  major_when:
  - 核心重难点完全未讲透
  - 大量时间偏离主题，导致学生无法掌握本节课的核心知识
  severity: context_dependent
  scoring_action: 若为 minor_when，仅作为改进建议或在 teaching_content 维度轻微扣分，通常只产生2–5分影响，但不存在70分或其他固定下限；同一维度多个相互独立且证据充分的问题必须累计；若为
    major_when，在 teaching_content 维度作为主要缺陷进行显著扣分，一个严重问题或与本维其他独立问题累计时，允许导致该维度低于60分。
  primary_dimension: teaching_content
  must_not_penalize_dimensions:
  - teaching_effect
  support_issue_key: depth_or_focus_weak
  confidence: medium
  approved: true
  support:
    n_records: 62
