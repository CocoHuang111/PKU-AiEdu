description: |
  1.040 covers three important aspects of construction project management: the theory, methods and quantitative tools used to effectively plan, organize, and control construction projects; efficient management methods revealed through practice and research; and hands-on, practical project management knowledge from on-site situations and field trips. The course relies on a basic project management framework in which the project life-cycle is broken into organizing, planning, monitoring, controlling and learning from old and current construction projects. Within the framework, students learn the methodologies and tools necessary for each aspect of the process as well as the theories upon which these are built. By the end of the term they are able to adapt and apply the framework to effectively manage a construction project in an Architecture/Engineering/Construction (A/E/C) organization.
