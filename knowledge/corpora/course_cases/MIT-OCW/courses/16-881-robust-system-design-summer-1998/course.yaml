description: |
  This course was created for the “product development” track of MIT’s System Design and Management Program (SDM) in conjunction with the Center for Innovation in Product Development. After taking this course, a student should be able to: Formulate measures of performance of a system or quality characteristics. These quality characteristics are to be made robust to noise affecting the system. Sythesize and select design concepts for robustness. Identify noise factors whose variation may affect the quality characteristics. Estimate the robustness of any given design (experimentally and analytically). Formulate and implement methods to reduce the effects of noise (parameter design, active control, adjustment). Select rational tolerances for a design. Explain the role of robust design techniques within the wider context of the product development process. Lead product development activities that include robust design techniques.
