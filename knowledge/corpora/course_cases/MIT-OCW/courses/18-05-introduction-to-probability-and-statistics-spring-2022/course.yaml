description: |
  This course provides an elementary introduction to probability and statistics with applications. Topics include basic combinatorics, random variables, probability distributions, Bayesian inference, hypothesis testing, confidence intervals, and linear regression. These same course materials, including interactive components (online reading questions and problem checkers) are available on MIT’s Open Learning Library , which is free to use. You have the option to enroll and track your progress, or you can view and use the materials without enrolling.
