description: |
  This course is an introduction to numerical methods and MATLAB®: Errors, condition numbers and roots of equations. Topics covered include Navier-Stokes; direct and iterative methods for linear systems; finite differences for elliptic, parabolic and hyperbolic equations; Fourier decomposition, error analysis and stability; high-order and compact finite-differences; finite volume methods; time marching methods; Navier-Stokes solvers; grid generation; finite volumes on complex geometries; finite element methods; spectral methods; boundary element and panel methods; turbulent flows; boundary layers; and Lagrangian coherent structures (LCSs). Prof. Pierre Lermusiaux is very grateful to the teaching assistants Dr. Matt Ueckermann, Dr. Tapovan Lolla, Mr. Jing Lin, and Mr. Arpit Agarwal for their contributions to the course over the years.
