description: |
  Every day, teachers make thousands of decisions: what content to teach, what activities to assign, who to call on, how to respond to a student question, how to react to student behavior. These day-to-day decisions can have an enormous effect on the lives of young people, for good and ill. They can open new doors or cause lasting harm; they can make students feel seen and valued, or dampen their interest in school. In this course, we will investigate these interactions, rehearse responding to difficult scenarios, and develop a set of equity teaching mindsets and practices to support all of our learners, especially underserved students. With colleagues from your school or organization and online learners around the world, you will participate in four cycles of inquiry, practice, and action, and then complete a final action project. In each cycle of inquiry, you will examine and re-examine dimensions of inequality through educator mindsets, imagine community change through documentary case studies, rehearse taking action in thorny situations through digital practice spaces, and begin to lead change through action-oriented assignments. Our early investigations will focus on relationships and interactions with individual students, and pan out to examine the effects of bias on classrooms, schools, and communities. As you complete activities with peers online, you will develop a rich set of resources and exercises to use with your students and colleagues in your local context. At the end of the course, you will have a better understanding of yourself and your students, new resources to draw on for helping all students thrive, and a plan to work with your school community to advance the lifelong work of equitable teaching. This course is part of the Open Learning Library , which is free to use. You have the option to sign up and enroll in the course if you want to track your progress, or you can view and use all the materials without enrolling.
