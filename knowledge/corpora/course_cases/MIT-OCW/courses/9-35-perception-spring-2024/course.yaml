description: |
  This course studies how the senses work and how physical stimuli are transformed into signals in the nervous system. It examines how the brain uses those signals to make inferences about the world and uses illusions and demonstrations to gain insight into those inferences, emphasizing audition and vision, with some discussion of touch, taste, and smell. Experience with psychophysical methods is provided. This course is supported in part by Dr. Eugene Stark, Jr. SB ‘68, SM ‘69, EE ‘70, SCD ‘72 for the 2026-2027 academic year.
