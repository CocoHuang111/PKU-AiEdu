description: |
  In this course you will learn the basics of photography and gain an intriguing new perspective into the visual world. We will begin with a gentle introduction to the tools, and after that, we start in earnest. Although we will emphasize photographing science and engineering, most of the material will easily apply to other kinds of macro photography. The course’s video tutorials will be accompanied by assignments using a camera, a flatbed scanner, and mobile devices. You will discover how subtle changes in lighting, composition, and background contribute to creating more effective images. You will also learn to think graphically and present your photographs for journal figures, covers, and grant submissions. We will also host interviews with notable image makers and art directors. In 2026, Felice Frankel updated the course with a video where she discusses AI and its role in generating images. Felice brings our attention to the pitfalls and ethics of using generative AI models to document research and outlines the necessary guardrails to ensure the production of honest and communicative images. About the Instructor Felice Frankel is an award-winning science photographer and research scientist in the Department of Chemical Engineering at the Massachusetts Institute of Technology. Felice’s images have been internationally published in books, journals, and magazines, including The New York Times , Nature, Science , National Geographic , and Discover . She is a fellow of the American Association for the Advancement of Science, a Gugghenheim Fellow, has received awards and grants from NSF, NEA, the Alfred P. Sloan Foundation, and was a senior research fellow in Harvard University’s Faculty of Arts and Sciences. Acknowledgements The production of these videos is supported by OpenCourseWare, MITx, the Center for Materials Science and Engineering and the following departments: Chemical Engineering, Materials Science and Engineering and Mechanical Engineering.
