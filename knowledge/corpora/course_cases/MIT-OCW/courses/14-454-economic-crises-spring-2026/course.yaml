description: |
  This half-semester, 13-week course provides a fast-paced description of the canonical macroeconomic models of ﬁnancial frictions and crises. We will cover various topics, including (i) ﬁnancial ampliﬁcation mechanisms; (ii) ﬁnancial intermediation and credit crunches; (iii) coordination failures and bank runs; (iv) speculative bubbles and credit booms; (v) liquidity traps and deleveraging; and (vi) sudden stops and ﬁnancial contagion.
