description: |
  This course examines nuclear power as a low‑carbon electricity source, balancing its potential role in addressing climate change against longstanding technical, economic, and social challenges. Topics include the ability of nuclear power to help mitigate climate change; challenges associated with ensuring nuclear safety; the effects of nuclear accidents; the management of nuclear waste; the linkages between nuclear power and nuclear weapons, the consequences of nuclear war; and political challenges to the safe and economic regulation of the nuclear industry. Students explore both fission and fusion technologies, emerging reactor designs, policy options, and the institutional and societal constraints shaping nuclear power’s future. Emphasis is placed on critical evaluation of tradeoffs, uncertainties, and value judgments involved in decisions about nuclear energy within an increasingly competitive renewable energy landscape.
