description: |
  This course covers the fundamentals of deep learning, including both theory and applications. Topics include neural net architectures (MLPs, CNNs, RNNs, graph nets, transformers), geometry and invariances in deep learning, backpropagation and automatic differentiation, learning theory and generalization in high dimensions, and applications to computer vision, natural language processing, and robotics. This course is supported for the 2026-2027 academic year in part by: Dr. Michael Borowitz SB ’71 Steven R. Weiss SB ‘66
