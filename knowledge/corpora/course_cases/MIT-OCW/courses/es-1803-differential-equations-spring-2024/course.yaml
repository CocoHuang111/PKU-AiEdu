description: |
  This course, taught to students in MIT’s Experimental Study Group, is equivalent to the Mathematics Department’s 18.03 Differential Equations . They satisfy the same prerequisites and are geared to preparing students for downstream science and engineering classes. MIT’s Experimental Study Group (ESG) is one of MIT’s first-year learning communities. Small class sizes allow for teaching interactively and staying in close touch with what every student is finding easy or difficult.
