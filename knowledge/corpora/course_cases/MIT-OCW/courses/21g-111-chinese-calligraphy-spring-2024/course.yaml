description: |
  Chinese calligraphy (书法 / 書法, shūfǎ)—the art of expressive brush writing—is one of the most esteemed and enduring artistic traditions in China. This introductory course invites students to explore calligraphy as both a classical discipline and a living art form that continues to evolve in contemporary contexts. The course integrates technical training, historical and cultural study, and reflective practice. Students will not only gain hands-on experience with the brush and ink, but also investigate the evolving role of calligraphy in Chinese society, from antiquity to the present day. Through museum visits, interdisciplinary exploration, and individual projects, students will gain a deeper understanding of Chinese culture, philosophy, and aesthetic values. A final video project allows students to reflect on their personal journey with calligraphy and document their artistic growth. No prior knowledge of the Chinese language is required.
