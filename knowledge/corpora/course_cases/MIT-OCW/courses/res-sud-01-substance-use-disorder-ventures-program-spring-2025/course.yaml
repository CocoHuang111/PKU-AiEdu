description: |
  Substance Use Disorder (SUD) Ventures is an intense and immersive hybrid program, offered through MIT Open Learning, whose aim is to fuel the next generation of innovation in the field of substance use treatment and research. This program is designed to support researchers and other innovators in the field of SUD with knowledge and examples of how to bring their innovations to market. The program and its research are supported by the National Institute on Drug Abuse of the National Institutes of Health under Award Number UE5DA056914. This award is subject to the Cooperative Agreement Terms and Conditions of Award as set forth in RFA DA-22–020, entitled “Growing Great Ideas: Research Education Course in Product Development and Entrepreneurship for Life Science Researchers (UE5 Clinical Trial Not Allowed).”
