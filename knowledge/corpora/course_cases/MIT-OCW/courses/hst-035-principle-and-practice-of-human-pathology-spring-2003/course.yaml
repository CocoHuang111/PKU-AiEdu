description: |
  This course provides a comprehensive overview of human pathology with emphasis on mechanisms of disease and diagnostic medicine. Topics include: Cellular Mechanisms of Disease Molecular Pathology Pathology of Major Organ Systems Review of Diagnostic Tools from Traditional Surgical Pathology to Diagnostic Spectroscopy Functional and Molecular Imaging Molecular Diagnostics In addition to lectures, one of the two weekly sessions includes a 2-3 hour laboratory component. Periodically, time will also be devoted to minicases. Lecturers Prof. Jon Aster, Prof. Frederick Bieber, Prof. Carlo Brugnara, Prof. Robert B. Colvin, Prof. Christopher Crum , Prof. Douglas Dockery, Prof. Mel Feany, Prof. Michael Feld, Prof. Jonathan Fletcher, Prof. Michael Gimbrone, Prof. Todd Golub, Prof. Frank B. Hu, Prof. Donald Ingber, Prof. Hart Lidov, Prof. David Louis, Prof. Richard Mitchell, Prof. Fiona Murray, Prof. Mark Redston, Prof. Helmut Rennke, Prof. Bruce Rosen, Prof. Frederick Schoen, Prof. Christine Seidman
