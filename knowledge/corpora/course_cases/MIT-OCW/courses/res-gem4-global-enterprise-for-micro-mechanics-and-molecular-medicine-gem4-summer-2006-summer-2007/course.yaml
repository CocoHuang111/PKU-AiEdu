description: |
  GEM 4 Vision GEM 4 has brought together researchers and professionals in major institutions across the globe with distinctly different, but complementary, expertise and facilities to address significant problems at the intersections of select topics of engineering, life sciences, technology, medicine and public health. GEM 4 creates new models for interactions across scientific disciplinary boundaries whereby problems spanning the range of fundamental science to clinical studies and public health can be addressed on a global scale through strategic international partnerships. Through initial focus areas in cell and molecular biomechanics, and environmental health, in the context of select human diseases, GEM 4 creates a global forum for the definition and exploration of grand challenges and scientific studies, for the cross-fertilization of ideas among engineers, life scientists and medical professionals, and for the development of novel educational tools. GEM 4 Activities GEM 4 enables the brokering of engineers, life scientists and medical professionals with shared facilities and joint students and post-doctoral fellows to tackle major problems in the context of human health and diseases that call for state-of-the-art experimental and computational tools in cell and molecular mechanics, biology and medicine. Broad examples of problems addressed include: infectious diseases such as malaria, cancer, cardiovascular diseases, biomechanical origins of inflammation. In each of these areas, the initial emphasis has included (but will not be limited to) molecular, subcellular and cellular mechanics applied to biomedicine, where a single investigator or institution is not likely to have the full spectrum of expertise, infrastructure or resources available to cover fundamental molecular science all the way to clinical studies and societal implications. Currently, twelve institutions in North America, Europe and Asia participate in this effort as Core institutions, focusing on mechanistic studies, as well as novel methods for diagnostics, vaccines or drug development and delivery. Funds have been raised to provide a structure for coordinated studies from major organizations under the umbrella of GEM 4 . These funds are being used for: organization of major symposia/conferences specifically targeted at the theme areas of the initiative, training grants for student fellowships for the partner institutions, summer schools to develop teaching materials, the exchange of students and researchers, operations of a central secretariat for handling the administrative and infrastructure details for such interactions, maintenance of a web site for dissemination of information. GEM 4 Online
