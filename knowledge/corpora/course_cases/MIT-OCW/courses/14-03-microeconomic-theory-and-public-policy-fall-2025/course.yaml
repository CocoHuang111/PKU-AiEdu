description: |
  14.03/003 is a fast-paced, interactive introduction to modern applied economics as it is lived, breathed, and practiced by academic researchers and policy analysts. You will master core tools of applied theory while learning how to frame and test causal relationships using research design, experimentation, and data analysis. In class and in the problem sets, you will read and we will discuss classic and contemporary research studies that put these pieces together.
