description: |
  This course examines the causes and consequences of American foreign policy since 1898. Course readings cover both substantive and methods topics. Four substantive topics are covered: major theories of American foreign policy; major episodes in the history of American foreign policy and historical/interpretive controversies about them; the evaluation of major past American foreign policies–were their results good or bad? and current policy controversies, including means of evaluating proposed policies. Three methods topics are covered: basic social scientific inference–what are theories? what are good theories? how should theories be framed and tested? historical investigative methodology, including archival research, and, most importantly, case study methodology. Historical episodes covered in the course are used as raw material for case studies, asking “if these episodes were the subject of case studies, how should those studies be performed, and what could be learned from them?”
