description: |
  This video lecture series begins with an introduction to the basics of anatomical and functional MRI and the time course of the fMRI signal, then delves into several methods for analyzing fMRI data. The series emphasizes how to think about fMRI data and the steps of analysis rather than the technical execution of each step. Lecture Topics: fMRI Bootcamp Part 1 - Basics of fMRI fMRI Bootcamp Part 2 - fMRI timecourse fMRI Bootcamp Part 3 - Univariate analysis fMRI Bootcamp Part 4 - Multivariate analysis fMRI Bootcamp Part 5 - Multivoxel pattern analysis (MVPA) fMRI Bootcamp Part 6 - Classification fMRI Bootcamp Part 7 - Representational similarity fMRI Bootcamp Part 8 - fMRI & multiple comparisons fMRI Bootcamp Part 9 - Hyperalignment Additional Resources: Rebecca Saxe’s Lab website Analyzing fMRI Data page in Modeling and Data Analysis Tools and Datasets Poldrack R. A., Mumford J. A., Nichols T. E. (2011) Handbook of Functional MRI Data Analysis , Cambridge University Press. ISBN: 9780521517669 [ hardcover, eBook , Google Books preview ]
