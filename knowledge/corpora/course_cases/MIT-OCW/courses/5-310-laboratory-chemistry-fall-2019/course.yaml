description: |
  This course introduces experimental chemistry for students who are not majoring in chemistry. The course covers principles and applications of chemical laboratory techniques, including preparation and analysis of chemical materials, measurement of pH, gas and liquid chromatography, visible-ultraviolet spectrophotometry, infrared spectroscopy, nuclear magnetic resonance, mass spectrometry, polarimetry, X-ray diffraction, kinetics, data analysis, and organic synthesis. Acknowledgements Dr. Dolhun and Dr. Hewett would like to acknowledge the contributions of past instructors over the years to the development of this course and its materials. WARNING NOTICE The experiments described in these materials are potentially hazardous and require a high level of safety training, special facilities and equipment, and supervision by appropriate individuals. You bear the sole responsibility, liability, and risk for the implementation of such safety procedures and measures. MIT shall have no responsibility, liability, or risk for the content or implementation of any of the material presented. Legal Notice
