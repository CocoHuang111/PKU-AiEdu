description: |
  Introduction to Solid State Chemistry is a first-year single-semester college course on the principles of chemistry. This unique and popular course satisfies MIT’s general chemistry degree requirement, with an emphasis on solid-state materials and their application to engineering systems. Course Format This course has been designed for independent study. It provides everything you will need to understand the concepts covered in the course. The materials include: A complete set of Lecture Videos by Prof. Sadoway. Detailed Course Notes for most video sessions, plus readings in several suggested textbooks. Homework problems with solution keys, to further develop your understanding. For Further Study collections of links to supplemental online content. Self-Assessment pages containing quiz and exam problems to assess your mastery, and Help Session Videos in which teaching assistants take you step-by-step through exam problem solutions. About OCW Scholar OCW Scholar courses are designed specifically for OCW’s single largest audience: independent learners. These courses are substantially more complete than typical OCW courses, and include new custom-created content as well as materials repurposed from previously published courses. Learn more about OCW Scholar .
