description: |
  How do we prepare K-12 students and learning communities to be as successful as possible? If future jobs require creativity, problem-solving, and communication, how do we teach these skills in meaningful ways? How do we bring together passionate school leaders to create systemic solutions to educational challenges? Come explore these questions and more in Design Thinking for Leading and Learning. The course is organized into three sections that combine design thinking content with real-world education examples, as well as opportunities for learners to apply concepts in their own setting. This course is part of the Open Learning Library , which is free to use. You have the option to sign up and enroll in the course if you want to track your progress, or you can view and use all the materials without enrolling.
