description: |
  15.514 is an intensive introduction to the preparation and interpretation of financial information for investors (external users) and managers (internal users) and to the use of financial instruments to support system and project creation. The course adopts a decision-maker perspective on accounting and finance with the goal of helping students develop a framework for understanding financial, managerial, and tax reports. 15.514 is restricted to System Design and Management students. Acknowledgements Acknowledgement is hereby given to Professor G. Peter Wilson for his authorship of the following content in this course: The Five Challenges (see Syllabus and Lecture 1) “What Do Intel and Accountants Have in Common?” (see Lecture 1) A Conceptual Framework for Financial Accounting (see Lecture 1)
