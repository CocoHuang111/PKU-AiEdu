description: |
  This course studies the transformation of childhood and youth since the 18th century in France and the development of sentimentality within the family in a francophone context. We will examine the personification of children as a source of inspiration for artistic creation and a political ideal aimed at protecting future generations, and consider various representations of childhood and youth in literature, movies, and songs. The course is taught entirely in French. About the instructor: Bruno Perreau is the Cynthia L. Reed Professor of French Studies at MIT and Director of MIT’s Center of Excellence in French Studies. He is also an Affiliate Faculty at the Center for European Studies, Harvard University. Perreau recently published The Politics of Adoption: Gender and the Making of French Citizenship (MIT Press, 2014), Queer Theory: The French Response (Stanford University Press, 2016), Les Défis de la République (ed. with Joan W. Scott, Presses de Sciences Po, 2017), Qui a peur de la théorie queer ? (Presses de Sciences Po, 2018), and Sphères d’injustice. Pour un universalisme minoritaire (La Découverte, 2023).
