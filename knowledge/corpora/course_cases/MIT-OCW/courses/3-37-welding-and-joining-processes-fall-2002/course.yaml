description: |
  Discusses a wide variety of processes and materials from the viewpoint of their fundamental physical and chemical properties. Specific topics: cold welding, adhesive bonding, diffusion bonding, soldering, brazing, flames, arcs, high-energy density heat sources, solidification, cracking resistance, shielding methods, and electric contacts. Emphasis on underlying science of a given process rather than a detailed description of the technique or equipment. This course meets with the first half of 3.371J in the Fall Term.
