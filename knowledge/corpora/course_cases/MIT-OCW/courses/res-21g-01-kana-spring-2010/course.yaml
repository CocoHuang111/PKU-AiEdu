description: |
  Learning hiragana and katakana is an important part of reading and speaking Japanese. The following pages contain: Hiragana - stroke order videos , pronunciation, and vocabulary for each character; reading and listening audio exercises ; handouts on how to construct words and sentences; interactive quizzes testing character recognition; and printable worksheets to practice writing characters. Katakana - pronunciation and vocabulary for each character ; reading and listening audio exercises ; interactive quizzes testing character and vocabulary recognition; and printable worksheets to practice writing characters. These materials were developed as part of the Japanese curriculum at MIT for students of all levels to learn and review. Students and instructors are encouraged to incorporate them directly or as supplements in their study of Japanese. Technical Requirements This site is encoded in Unicode (UTF-8); please check your browser settings if characters render incorrectly: Internet Explorer version 6.0+ (Windows) - View → Encoding Safari version 4.0+ (Mac OSX) - View → Text Encoding Firefox 3.0+ (all platforms) - View → Character Encoding Opera (all platforms) - View → Encoding
