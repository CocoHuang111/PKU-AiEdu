description: |
  This course explores the creation of new learning environments and experiences through the lens of the STEAM Learning Architecture, a framework developed by the pK-12 group at MIT Open Learning to guide approaches to teaching and learning for educational innovation. The framework prioritizes student-centered, hands-on learning, rooted in the Constructionist theory that the most powerful learning occurs through discovery, exploration, and creation. Guest speakers and site visits will provide context for final projects that produce innovative learning experiences for K-12 audiences.
