description: |
  Are you interested in building and testing your own imaging radar system? MIT Lincoln Laboratory offers this 3-week course in the design, fabrication, and test of a laptop-based radar sensor capable of measuring Doppler, range, and forming synthetic aperture radar (SAR) images. You do not have to be a radar engineer but it helps if you are interested in any of the following; electronics, amateur radio, physics, or electromagnetics. It is recommended that you have some familiarity with MATLAB®. Teams of three students will receive a radar kit and will attend a total of 5 sessions spanning topics from the fundamentals of radar to SAR imaging. Experiments will be performed each week as the radar kit is implemented. You will bring your radar kit into the field and perform additional experiments such as measuring the speed of passing cars or plotting the range of moving targets. A final SAR imaging contest will test your ability to form a SAR image of a target scene of your choice from around campus; the most detailed and most creative image wins. Acknowledgement and Disclaimer This work is sponsored by the Department of the Air Force under Air Force Contract #FA8721-05-C-0002. Opinions, interpretations, conclusions and recommendations are those of the authors and are not necessarily endorsed by the United States Government.
