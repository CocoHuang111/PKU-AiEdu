description: |
  This tutorial covers optimization strategies for diffusion models used in image and video generation; topics include architecture design, hardware efficiency, and inference techniques. Speaker: Sayak Paul, Hugging Face. This tutorial is part of a seminar series led by graduate students and postdocs in the MIT Department of Brain and Cognitive Sciences (BCS) from 2015 to the present, featuring topics relevant to research on intelligence in neuroscience, cognitive science, and artificial intelligence. The tutorials are aimed at participants who have some computational background but are not experts on these topics. This series was organized by Sol Markman and Ajani Stewart, graduate students in the Department of Brain and Cognitive Sciences.
