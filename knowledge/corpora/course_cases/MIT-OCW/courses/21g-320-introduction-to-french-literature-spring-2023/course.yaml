description: |
  This course is a study of major French literary genres and an introduction to methods of literary analysis. This semester, students will serve on the jury for the Goncourt Prize USA. “Le Goncourt” is the most prestigious literary prize in France. Students will study and rank books on the Goncourt shortlist. They will elect a representative to present their selection at the Villa Albertine in New York and choose the winner along with students from Princeton, Duke, Yale, Harvard, Columbia, and the University of Virginia. Meanwhile, the other students will prepare a press article to present their experience as a jury! Special attention is devoted to the improvement of French language skills. The course is taught in French. About the instructor: Bruno Perreau is the Cynthia L. Reed Professor of French Studies at MIT and Director of MIT’s Center of Excellence in French Studies. He is also an Affiliate Faculty at the Center for European Studies, Harvard University. Perreau recently published The Politics of Adoption: Gender and the Making of French Citizenship (MIT Press, 2014), Queer Theory: The French Response (Stanford University Press, 2016), Les Défis de la République (ed. with Joan W. Scott, Presses de Sciences Po, 2017), Qui a peur de la théorie queer ? (Presses de Sciences Po, 2018), and Sphères d’injustice. Pour un universalisme minoritaire (La Découverte, 2023).
