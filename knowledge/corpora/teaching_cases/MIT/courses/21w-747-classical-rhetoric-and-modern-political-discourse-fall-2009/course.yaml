description: |
  This course is an introduction to the history, theory, practice, and implications of rhetoric, the art and craft of persuasion through Analyzing persuasive texts and speeches Creating persuasive texts and speeches Through class discussions, presentations, and written assignments, you will get to practice your own rhetorical prowess. Through the readings, you’ll also learn some ways to make yourself a more efficient reader, as you turn your analytical skills on the texts themselves. This combination of reading, speaking, and writing will help you succeed in: learning to read and think critically techniques of rhetorical analysis techniques of argument to enhance your written and oral discourse with appropriate figures of speech some techniques of oral presentation and the use of visual aids and visual rhetoric.
