description: |
  Do you know what your bank does with your money? What is the role of a bank in producing societal well-being? This course looks into banks that operate differently, namely, “just banks" that use capital and finance as a tool to address social and ecological challenges. This course is for anyone who wants to understand the unique role banks play as intermediaries in our economy and how they can leverage that position to produce positive social, environmental, and economic change. Go to OCW’s Open Learning Library site for 11.405x: Just Money: Banking as if Society Mattered . The site is free to use, just like all OCW sites. You have the option to sign up and enroll in the course if you want to track your progress, or you can view and use all the materials without enrolling.
