description: |
  The Election Resource Hub connects election administrators and practitioners with the latest in election science research. The website compiles evidence-based research and recommendations for election officials, policymakers, media, and the public. The resource contains election guides, reports, academic publications, videos, podcasts, data, and more. You may also be interested in the MIT Election Data + Science Lab , which aims to improve the democratic experience for U.S. voters by applying scientific principles to how elections are studied and administered.
