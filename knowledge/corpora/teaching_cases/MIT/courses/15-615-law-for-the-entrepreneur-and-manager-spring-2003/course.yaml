description: |
  This course provides a basic understanding of legal issues that corporations face during their existence. The course starts by providing the basic building blocks of business law. We then follow a firm through its life cycle from its “breakaway” from an established firm through it going public. The materials covered during 15.647 (the first half of the semester) emphasize the organization and financing of the company. In the second half of the course we examine a broad array of law-sensitive issues relating to intellectual property, product development, M&A transactions, international trade, the duties of directors and officers, business disputes, and bankruptcy and reorganization. The goal of the course is not to impart technical legal skills, but to enhance the judgment which students will bring to their responsibilities as entrepreneurs, managers in established companies, or consultants and advisors. There are two take-home exercises, and no exams. Students wishing to take only the first half of the Manager’s Legal Function should register for 15.647, which meets only during the H1 period.
