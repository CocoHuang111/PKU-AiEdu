description: |
  Professor Nancy Kanwisher uses a brain imaging method called fMRI to study the human brain. Her website, Nancy’s Brain Talks, is a collection of short videos that explore the different scientific techniques used to study the human mind and brain. You do not need any background in the field to understand the talks. Topics include: What Kinds of Minds and Brains Do We Have? How Can You Study the Human Mind and Brain? Face Perception fMRI Imaging of the Human Brain at Work The site also includes lecture videos from Prof. Kanwisher’s undergraduate MIT course 9.13 The Human Brain . You can find a complete version of this course here on MIT OpenCourseWare .
