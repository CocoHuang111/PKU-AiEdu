description: |
  This course introduces students to the modeling, quantification, and analysis of uncertainty. The tools of probability theory, and of the related field of statistical inference, are the keys for being able to analyze and make sense of data. These tools underlie important advances in many fields, from the basic sciences to engineering and management. Course Format This course has been designed for independent study. It provides everything you will need to understand the concepts covered in the course. The materials include: Lecture Videos by MIT Professor John Tsitsiklis Lecture Slides and Readings Recitation Problems and Solutions Recitation Help Videos by MIT Teaching Assistants Tutorial Problems and Solutions Tutorial Help Videos by MIT Teaching Assistants Problem Sets with Solutions Exams with Solutions Related Resource A complementary resource, Introduction to Probability , is provided by the videos developed for an EdX version of 6.041. These videos cover more or less the same content, in somewhat different order, and in somewhat more detail than the videotaped live lectures.
